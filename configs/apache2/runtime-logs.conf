# Keep private logs inaccessible even when /htdocs is a persistent volume
# containing an older or missing .htaccess. Inherited by HTTP and HTTPS.
# Do not deny all of /htdocs/storage: public storage may be served there.
# AllowOverride is only effective in non-regex Directory sections.
<Directory "/htdocs/storage/logs">
    AllowOverride None
</Directory>
<Directory "/htdocs/assets/storage/logs">
    AllowOverride None
</Directory>
<DirectoryMatch "^/htdocs/(?:assets/)?storage/logs(?:/|$)">
    Require all denied
</DirectoryMatch>
